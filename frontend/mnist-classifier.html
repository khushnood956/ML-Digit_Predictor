<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digit Classification System</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background-color: #ffffff;
      color: #000000;
    }

    .container {
      min-height: 100vh;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 60px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .title {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin: 0 0 12px 0;
    }

    .subtitle {
      font-size: 14px;
      color: #666666;
      margin: 0;
      line-height: 1.6;
    }

    .main-content {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .section {
      padding: 32px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background-color: #fafafa;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 20px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #000000;
    }

    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid #e0e0e0;
    }

    .mode-tab {
      flex: 1;
      padding: 12px 16px;
      border: none;
      background-color: transparent;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 200ms ease;
      color: #666666;
    }

    .mode-tab.active {
      color: #000000;
      border-bottom-color: #000000;
    }

    .canvas-container {
      margin-bottom: 24px;
    }

    .canvas {
      display: block;
      width: 280px;
      height: 280px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      cursor: crosshair;
      background-color: #000000;
      margin: 0 auto 16px;
      box-shadow: inset 0 0 0 1px #d0d0d0;
    }

    .canvas-hint {
      font-size: 13px;
      color: #999999;
      text-align: center;
      margin: 8px 0 16px 0;
    }

    .upload-container {
      margin-bottom: 24px;
    }

    .file-input {
      display: none;
    }

    .file-label {
      display: block;
      padding: 16px;
      border: 1px dashed #d0d0d0;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      color: #666666;
      transition: all 200ms ease;
      background-color: #ffffff;
      user-select: none;
    }

    .file-label:hover {
      background-color: #f5f5f5;
    }

    .uploaded-image-container {
      margin-top: 16px;
      text-align: center;
    }

    .uploaded-image {
      max-width: 200px;
      max-height: 200px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      margin: 0 auto 12px;
      display: block;
    }

    .button-primary {
      width: 100%;
      padding: 12px 16px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 200ms ease;
    }

    .button-primary:hover:not(:disabled) {
      opacity: 0.85;
    }

    .button-primary:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      color: #666666;
    }

    .button-secondary {
      width: 100%;
      padding: 10px 14px;
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 200ms ease;
    }

    .button-secondary:hover {
      opacity: 0.85;
    }

    .spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background-color: #ffffff;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }

    .result-box {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 24px;
    }

    .prediction-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e0e0e0;
    }

    .prediction-label {
      font-size: 12px;
      font-weight: 600;
      color: #999999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .prediction-value {
      font-size: 56px;
      font-weight: 700;
      color: #000000;
      line-height: 1;
    }

    .result-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .result-item {
      display: flex;
      flex-direction: column;
    }

    .result-label {
      font-size: 12px;
      font-weight: 600;
      color: #999999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 18px;
      font-weight: 600;
      color: #000000;
    }

    .error-box {
      background-color: #fff5f5;
      border: 1px solid #ffc4c4;
      border-radius: 4px;
      padding: 12px 16px;
      font-size: 13px;
      color: #c41e3a;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const MNISTClassifier = () => {
      const [inputMode, setInputMode] = useState('canvas');
      const [uploadedImage, setUploadedImage] = useState(null);
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const canvasRef = useRef(null);
      const contextRef = useRef(null);

      const API_URL = 'http://localhost:8080';

      // Initialize canvas
      useEffect(() => {
        if (inputMode === 'canvas') {
          const canvas = canvasRef.current;
          if (canvas) {
            const context = canvas.getContext('2d');
            context.fillStyle = '#000000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            contextRef.current = context;
          }
        }
      }, [inputMode]);

      // Canvas drawing handlers
      const startDrawing = (e) => {
        const { offsetX, offsetY } = e.nativeEvent;
        contextRef.current.strokeStyle = '#ffffff';
        contextRef.current.lineWidth = 8;
        contextRef.current.lineCap = 'round';
        contextRef.current.lineJoin = 'round';
        contextRef.current.beginPath();
        contextRef.current.moveTo(offsetX, offsetY);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const { offsetX, offsetY } = e.nativeEvent;
        contextRef.current.lineTo(offsetX, offsetY);
        contextRef.current.stroke();
      };

      const stopDrawing = () => {
        contextRef.current.closePath();
        setIsDrawing(false);
      };

      // Resize image to 28x28
      const resizeImage = async (imgData, targetSize = 28) => {
        return new Promise((resolve) => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = targetSize;
          canvas.height = targetSize;

          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0, targetSize, targetSize);
            const imageData = ctx.getImageData(0, 0, targetSize, targetSize);
            resolve(imageData);
          };
          img.src = imgData;
        });
      };

      // Convert image to grayscale and flatten
      const imageToPixelArray = (imageData) => {
        const data = imageData.data;
        const pixels = [];

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const gray = (r + g + b) / 3;
          pixels.push(gray / 255);
        }

        return pixels;
      };

      // Convert canvas to pixel array
const canvasToPixelArray = async () => {
  const canvas = canvasRef.current;
  
  if (!canvas) {
    throw new Error('Canvas reference not found');
  }
  
  // Resize canvas to 28x28
  const resizedCanvas = document.createElement('canvas');
  resizedCanvas.width = 28;
  resizedCanvas.height = 28;
  
  const resizedCtx = resizedCanvas.getContext('2d');
  resizedCtx.drawImage(canvas, 0, 0, 28, 28);
  
  const imageData = resizedCtx.getImageData(0, 0, 28, 28);
  const data = imageData.data;
  
  const pixels = [];

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];
    const gray = (r + g + b) / 3;
    pixels.push(gray / 255);
  }

  return pixels;
};

      // Handle file upload
      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setError(null);
        setResult(null);

        const reader = new FileReader();
        reader.onload = (event) => {
          setUploadedImage(event.target.result);
        };
        reader.readAsDataURL(file);
      };

      // Predict
      const handlePredict = async () => {
        setError(null);
        setResult(null);
        setLoading(true);

        try {
          let pixels;

          if (inputMode === 'canvas') {
            try {
              pixels = await canvasToPixelArray();
            } catch (innerErr) {
              throw innerErr;
            }
          } else if (uploadedImage) {
            const resizedImage = await resizeImage(uploadedImage, 28);
            pixels = imageToPixelArray(resizedImage);
          } else {
            setError('Please upload an image or draw a digit.');
            setLoading(false);
            return;
          }

          if (!pixels || pixels.length !== 784) {
            const errMsg = `Invalid pixel count: ${pixels ? pixels.length : 'undefined'}. Expected 784.`;
            setError(errMsg);
            setLoading(false);
            return;
          }

          const startTime = performance.now();

          const response = await fetch(`${API_URL}/api/predict`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ pixels }),
          });

          if (!response.ok) {
            throw new Error(`API error: ${response.status}`);
          }

          const data = await response.json();
          const endTime = performance.now();

          setResult({
            prediction: data.prediction,
            confidence: (data.confidence * 100).toFixed(2),
            processing_time_ms: Math.round(endTime - startTime),
          });
        } catch (err) {
          setError(`Failed to predict: ${err.message}`);
        } finally {
          setLoading(false);
        }
      };

      // Clear canvas
      const clearCanvas = () => {
        const canvas = canvasRef.current;
        contextRef.current.fillStyle = '#000000';
        contextRef.current.fillRect(0, 0, canvas.width, canvas.height);
        setResult(null);
        setError(null);
      };

      // Clear upload
      const clearUpload = () => {
        setUploadedImage(null);
        setResult(null);
        setError(null);
      };

      const canPredict = inputMode === 'canvas' || uploadedImage;

      return (
        <div className="container">
          {/* Header */}
          <div className="header">
            <h1 className="title">Digit Classification System</h1>
            <p className="subtitle">Upload or draw a digit (0–9) for prediction</p>
          </div>

          {/* Main Content */}
          <div className="main-content">
            {/* Input Section */}
            <div className="section">
              <h2 className="section-title">Input</h2>

              {/* Mode Tabs */}
              <div className="mode-tabs">
                <button
                  className={`mode-tab ${inputMode === 'canvas' ? 'active' : ''}`}
                  onClick={() => {
                    setInputMode('canvas');
                    setUploadedImage(null);
                    setResult(null);
                  }}
                >
                  Draw
                </button>
                <button
                  className={`mode-tab ${inputMode === 'upload' ? 'active' : ''}`}
                  onClick={() => {
                    setInputMode('upload');
                    clearCanvas();
                  }}
                >
                  Upload
                </button>
              </div>

              {/* Canvas Input */}
              {inputMode === 'canvas' && (
                <div className="canvas-container">
                  <canvas
                    ref={canvasRef}
                    width={280}
                    height={280}
                    onMouseDown={startDrawing}
                    onMouseMove={draw}
                    onMouseUp={stopDrawing}
                    onMouseLeave={stopDrawing}
                    className="canvas"
                  />
                  <p className="canvas-hint">Draw a digit with your mouse</p>
                  <button className="button-secondary" onClick={clearCanvas}>
                    Clear
                  </button>
                </div>
              )}

              {/* Upload Input */}
              {inputMode === 'upload' && (
                <div className="upload-container">
                  <input
                    type="file"
                    accept="image/*"
                    onChange={handleFileUpload}
                    className="file-input"
                    id="file-input"
                  />
                  <label htmlFor="file-input" className="file-label">
                    Choose Image
                  </label>
                  {uploadedImage && (
                    <div className="uploaded-image-container">
                      <img src={uploadedImage} alt="Uploaded" className="uploaded-image" />
                      <button className="button-secondary" onClick={clearUpload}>
                        Remove
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* Predict Button */}
              <button
                className="button-primary"
                onClick={handlePredict}
                disabled={loading || !canPredict}
              >
                {loading ? (
                  <span className="spinner">
                    <span className="spinner-dot"></span> Processing...
                  </span>
                ) : (
                  'Predict'
                )}
              </button>
            </div>

            {/* Result Section */}
            {(result || error) && (
              <div className="section">
                <h2 className="section-title">Result</h2>

                {error && <div className="error-box">{error}</div>}

                {result && (
                  <div className="result-box">
                    <div className="prediction-display">
                      <span className="prediction-label">Predicted Digit</span>
                      <span className="prediction-value">{result.prediction}</span>
                    </div>

                    <div className="result-details">
                      <div className="result-item">
                        <span className="result-label">Confidence</span>
                        <span className="result-value">{result.confidence}%</span>
                      </div>
                      <div className="result-item">
                        <span className="result-label">Processing Time</span>
                        <span className="result-value">{result.processing_time_ms}ms</span>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<MNISTClassifier />, document.getElementById('root'));
  </script>
</body>
</html>
